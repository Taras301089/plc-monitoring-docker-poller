<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLC Monitoring System</title>
  <style>
    :root {
      font-family: "Segoe UI", sans-serif;
      --bg-primary: white;
      --bg-secondary: #f0f3f6;
      --bg-tertiary: #e6ebed;
      --fg-primary: #17202a;
      --fg-secondary: #536471;
      --border-color: #c7d0d7;
      --header-bg: #17324d;
      --button-primary: #177245;
      --button-primary-hover: #125d39;
      --button-secondary: #2b6cb0;
      --button-secondary-hover: #1f4d7a;
      --button-tertiary: #536471;
      --status-border: #8493a0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #2a2a2a;
        --bg-secondary: #333333;
        --bg-tertiary: #404040;
        --fg-primary: #e8e8e8;
        --fg-secondary: #b0b0b0;
        --border-color: #444444;
        --header-bg: #0f1419;
        --button-primary: #2ea86e;
        --button-primary-hover: #23845a;
        --button-secondary: #3d8bcf;
        --button-secondary-hover: #2f6fa8;
        --button-tertiary: #6a7a87;
        --status-border: #5a6f7a;
      }
    }
    [data-theme="dark"] {
      --bg-primary: #2a2a2a;
      --bg-secondary: #333333;
      --bg-tertiary: #404040;
      --fg-primary: #e8e8e8;
      --fg-secondary: #b0b0b0;
      --border-color: #444444;
      --header-bg: #0f1419;
      --button-primary: #2ea86e;
      --button-primary-hover: #23845a;
      --button-secondary: #3d8bcf;
      --button-secondary-hover: #2f6fa8;
      --button-tertiary: #6a7a87;
      --status-border: #5a6f7a;
    }
    [data-theme="light"] {
      --bg-primary: white;
      --bg-secondary: #f0f3f6;
      --bg-tertiary: #e6ebed;
      --fg-primary: #17202a;
      --fg-secondary: #536471;
      --border-color: #c7d0d7;
      --header-bg: #17324d;
      --button-primary: #177245;
      --button-primary-hover: #125d39;
      --button-secondary: #2b6cb0;
      --button-secondary-hover: #1f4d7a;
      --button-tertiary: #536471;
      --status-border: #8493a0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg-secondary); color: var(--fg-primary); }
    body { display: flex; flex-direction: column; min-height: 100vh; }

    .theme-toggle { background: none; color: var(--fg-secondary); border: none; padding: 0; cursor: pointer; font-size: 16px; margin: 0 8px; display: flex; align-items: center; }
    .theme-toggle:hover { opacity: 0.8; }

    /* Навигационные табы */
    .tabs { background: var(--bg-primary); border-bottom: 2px solid var(--border-color); display: flex; gap: 0; padding: 0; margin: 0; align-items: stretch; }
    .tab { padding: 12px 16px; cursor: pointer; border: none; background: none; font-size: 13px; color: var(--fg-secondary); font-weight: 500; border-bottom: 3px solid transparent; margin: 0; white-space: nowrap; }
    .tab:hover { background: var(--bg-secondary); }
    .tab.active { color: var(--button-primary); border-bottom-color: var(--button-primary); }
    .tabs-divider { flex: 1; border-right: 1px solid var(--border-color); }
    .tabs-tools { display: flex; gap: 0; margin-left: auto; }
    .tabs-tools .theme-toggle { padding: 0 12px; display: flex; align-items: center; }

    /* Основной контент */
    main { flex: 1; max-width: 100%; padding: 16px 20px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Toolbar компактнее */
    .toolbar { display: grid; grid-template-columns: 1fr 1fr 1fr auto auto auto; gap: 8px; margin-bottom: 12px; }
    select, input, button { min-height: 36px; border: 1px solid var(--border-color); border-radius: 4px; padding: 0 10px; font: inherit; background: var(--bg-primary); color: var(--fg-primary); font-size: 13px; }
    button { background: var(--button-primary); color: white; border-color: var(--button-primary); cursor: pointer; font-weight: 600; }
    button:hover { background: var(--button-primary-hover); }
    #refresh { background: var(--button-secondary) !important; border-color: var(--button-secondary) !important; }
    #refresh:hover { background: var(--button-secondary-hover) !important; }

    /* Статус компактнее */
    .status { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 8px 12px; border: 1px solid var(--border-color); border-left: 4px solid var(--status-border); border-radius: 4px; background: var(--bg-secondary); color: var(--fg-secondary); font-size: 13px; margin: 8px 0; }
    .status-title { font-weight: 700; color: var(--fg-primary); white-space: nowrap; }
    .status-detail { overflow-wrap: anywhere; font-size: 12px; }
    .status.loading { border-left-color: #b7791f; background: #fffaf0; color: #3d3000; }
    .status.loading .status-title { color: #8a5a00; }
    .status.success { border-left-color: #177245; background: #effaf3; color: #0a3820; }
    .status.success .status-title { color: #0a3820; }
    .status.error { border-left-color: #b42318; background: #fff2f0; color: #5a1a12; }
    .status.error .status-title { color: #5a1a12; }
    [data-theme="dark"] .status.loading { background: #3a3000; color: #e8d78a; }
    [data-theme="dark"] .status.loading .status-title { color: #f4e4a6; }
    [data-theme="dark"] .status.success { background: #1a3a26; color: #7dd9a8; }
    [data-theme="dark"] .status.success .status-title { color: #7dd9a8; }
    [data-theme="dark"] .status.error { background: #3a1a14; color: #e8a89a; }
    [data-theme="dark"] .status.error .status-title { color: #e8a89a; }

    /* Дерево компактнее */
    .tree-wrap { max-height: calc(100vh - 200px); overflow: auto; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .tree { list-style: none; padding: 0; margin: 0; }
    .tree-item { margin: 0; }
    .db-item { display: flex; align-items: center; gap: 4px; padding: 3px 10px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); cursor: pointer; user-select: none; font-weight: 600; font-size: 12px; color: var(--fg-primary); min-height: 24px; }
    .db-item:hover { background: var(--bg-tertiary); }
    .db-item.collapsed::before { content: '▶'; display: inline-block; width: 12px; color: var(--fg-secondary); font-size: 11px; }
    .db-item.expanded::before { content: '▼'; display: inline-block; width: 12px; color: var(--fg-secondary); font-size: 11px; }
    .db-item.expanded { background: var(--bg-tertiary); }
    .db-items { display: none; }
    .db-items.visible { display: block; }
    .var-item { display: flex; align-items: center; gap: 4px; padding: 2px 10px 2px 28px; border-bottom: 1px solid var(--border-color); font-size: 11px; min-height: 22px; }
    .var-item:hover { background: var(--bg-secondary); }
    .var-checkbox { width: 16px; height: 16px; accent-color: var(--button-primary); cursor: pointer; margin: 0; }
    .var-name { flex: 0 0 150px; color: var(--fg-primary); font-weight: 500; }
    .var-datatype { flex: 0 0 80px; color: var(--fg-secondary); font-family: monospace; font-size: 11px; }
    .var-nodeid { flex: 1; color: var(--fg-secondary); font-family: monospace; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .var-settings { display: flex; gap: 6px; }
    .var-settings input { width: 14px; height: 14px; margin: 0; accent-color: var(--button-primary); cursor: pointer; }
    .var-settings label { font-size: 11px; display: flex; align-items: center; gap: 3px; }

    /* Settings вкладка */
    .settings-form { max-width: 500px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: var(--fg-primary); }
    input[type="text"], input[type="number"] { width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--fg-primary); font-size: 13px; }
    .connection-status { display: flex; align-items: center; gap: 10px; margin-top: 20px; padding: 12px; background: var(--bg-secondary); border-radius: 4px; border: 1px solid var(--border-color); }
    .status-indicator { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .status-indicator.connected { background: #d4edda; color: #155724; }
    .status-indicator.disconnected { background: #f8d7da; color: #721c24; }
    .status-text { flex: 1; }
    .status-text strong { display: block; font-size: 13px; margin-bottom: 2px; }
    .status-text small { font-size: 12px; color: var(--fg-secondary); }

    /* Expand/Collapse buttons */
    .action-buttons { display: flex; gap: 8px; margin-bottom: 12px; }
    .action-buttons button { padding: 6px 12px; font-size: 13px; }

    .empty { padding: 32px; text-align: center; color: var(--fg-secondary); font-size: 13px; }
  </style>
</head>
<body>
  <nav class="tabs">
    <button class="tab active" data-tab="browser">📊 Переменные ПЛК</button>
    <button class="tab" data-tab="saved">💾 Переменные БД</button>
    <button class="tab" data-tab="charts">📈 Графики</button>
    <button class="tab" data-tab="notifications">🔔 Оповещения</button>
    <div class="tabs-divider"></div>
    <div class="tabs-tools">
      <button id="theme-toggle" class="theme-toggle" title="Переключить тему">🌙</button>
      <a href="reference.html" style="color: var(--fg-secondary); text-decoration: none; font-size: 13px; padding: 12px 16px; border-bottom: 3px solid transparent; display: flex; align-items: center; white-space: nowrap;">📖 Справка</a>
    </div>
  </nav>

  <main>
    <!-- TAB 1: PLC Variables Browser -->
    <div id="browser" class="tab-content active">
      <div class="toolbar">
        <select id="plc" style="grid-column: 1;"></select>
        <input id="db-filter" placeholder="Фильтр по Data Block" style="grid-column: 2;">
        <input id="var-filter" placeholder="Фильтр по переменной" style="grid-column: 3;">
        <button id="load">Загрузить из БД</button>
        <button id="refresh">Обновить с ПЛК</button>
        <button id="save">Сохранить выбранные</button>
      </div>
      <div class="action-buttons">
        <button id="expand-all" style="background: var(--button-tertiary); border-color: var(--button-tertiary);">▼ Развернуть все</button>
        <button id="collapse-all" style="background: var(--button-tertiary); border-color: var(--button-tertiary);">▶ Свернуть все</button>
      </div>
      <div class="status" id="status" role="status">
        <span class="status-title">Готово</span>
        <span class="status-detail">Выберите ПЛК и нажмите «Загрузить из БД» или «Обновить с ПЛК»</span>
      </div>
      <div class="tree-wrap">
        <ul class="tree" id="rows"><li class="empty">Данные не загружены</li></ul>
      </div>
    </div>

    <!-- TAB 2: DB Variables -->
    <div id="saved" class="tab-content">
      <p style="color: var(--fg-secondary); font-size: 13px;">Переменные из БД будут показаны здесь</p>
    </div>

    <!-- TAB 3: Charts -->
    <div id="charts" class="tab-content">
      <p style="color: var(--fg-secondary); font-size: 13px;">Графики будут показаны здесь</p>
    </div>

    <!-- TAB 4: Alerts & Notifications -->
    <div id="notifications" class="tab-content">
      <div class="settings-form">
        <h2 style="font-size: 16px; margin-top: 0;">Параметры подключения и оповещений</h2>

        <div class="form-group">
          <label for="plc-name">Имя ПЛК:</label>
          <input type="text" id="plc-name" placeholder="например, PLC1" value="Changang">
        </div>

        <div class="form-group">
          <label for="plc-ip">IP-адрес ПЛК:</label>
          <input type="text" id="plc-ip" placeholder="192.168.1.100">
        </div>

        <div class="form-group">
          <label for="plc-port">Порт:</label>
          <input type="number" id="plc-port" placeholder="4840" value="4840">
        </div>

        <div class="form-group">
          <label for="plc-endpoint">OPC UA Endpoint (опционально):</label>
          <input type="text" id="plc-endpoint" placeholder="opc.tcp://192.168.1.100:4840">
        </div>

        <button id="test-connection" style="background: var(--button-secondary); border-color: var(--button-secondary); padding: 8px 16px;">🔗 Проверить подключение</button>
        <button id="save-settings" style="padding: 8px 16px;">💾 Сохранить параметры</button>

        <div class="connection-status" id="connection-status" style="display: none;">
          <div class="status-indicator disconnected">✕</div>
          <div class="status-text">
            <strong>Отключено</strong>
            <small>Нажмите «Проверить подключение» для проверки</small>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const plc = document.querySelector('#plc');
    const dbFilter = document.querySelector('#db-filter');
    const varFilter = document.querySelector('#var-filter');
    const load = document.querySelector('#load');
    const refresh = document.querySelector('#refresh');
    const save = document.querySelector('#save');
    const expandAll = document.querySelector('#expand-all');
    const collapseAll = document.querySelector('#collapse-all');
    const status = document.querySelector('#status');
    const rows = document.querySelector('#rows');

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });

    async function loadPlcs() {
      try {
        const response = await fetch('/api/plcs');
        if (!response.ok) throw new Error('Ошибка загрузки списка ПЛК');
        const items = await response.json();
        plc.replaceChildren(...items.map(item => {
          const status = item.is_active ? '🟢' : '❌';
          const ip = item.ip_address || 'N/A';
          return new Option(`${status} ${item.name} - ${ip}`, item.id);
        }));
        if (items.length) {
          setStatus('success', 'Готово', 'Выберите ПЛК и нажмите «Загрузить из БД» или «Обновить с ПЛК»');
        }
      } catch (error) {
        setStatus('error', 'Ошибка API', error.message);
      }
    }

    function setStatus(kind, title, detail) {
      status.className = `status ${kind}`;
      status.innerHTML = `<span class="status-title">${title}</span><span class="status-detail">${detail}</span>`;
    }

    function buildHierarchy(items) {
      const tree = {};
      items.forEach(item => {
        const fullPath = item.browse_path ? item.browse_path.split('.') : [item.variable_name];
        // Filter out "Inputs" and "Static" levels
        const path = fullPath.filter(p => p !== 'Inputs' && p !== 'Static');

        let current = tree;
        for (let i = 0; i < path.length - 1; i++) {
          const key = path[i];
          if (!current[key]) current[key] = {};
          else if (Array.isArray(current[key])) return;
          current = current[key];
        }
        const varKey = path[path.length - 1];
        if (!current[varKey]) current[varKey] = [];
        else if (!Array.isArray(current[varKey])) return;
        current[varKey].push(item);
      });
      return tree;
    }

    async function loadVariables(forceRefresh = false) {
      if (!plc.value) return;
      setStatus('loading', 'Загрузка...', forceRefresh ? 'Сканирование OPC UA...' : 'Чтение из БД...');
      load.disabled = true;
      refresh.disabled = true;
      try {
        const params = new URLSearchParams();
        if (dbFilter.value.trim()) params.set('db', dbFilter.value.trim());
        if (varFilter.value.trim()) params.set('name', varFilter.value.trim());
        if (forceRefresh) params.set('refresh', 'true');
        const response = await fetch(`/api/plcs/${plc.value}/opcua/variables?${params}`);
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || 'Ошибка просмотра');
        renderHierarchy(payload);
        setStatus('success', 'Успешно', `Загружено ${payload.length} переменных`);
      } catch (error) {
        rows.innerHTML = '<li class="empty">Данных нет</li>';
        setStatus('error', 'Ошибка', error.message);
      } finally { load.disabled = false; refresh.disabled = false; }
    }

    function renderHierarchy(items) {
      if (!items.length) {
        rows.innerHTML = '<li class="empty">Переменные не найдены</li>';
        return;
      }
      const tree = buildHierarchy(items);
      function countVars(node) {
        if (Array.isArray(node)) return node.length;
        return Object.values(node).reduce((sum, n) => sum + countVars(n), 0);
      }
      function renderNode(key, node, depth) {
        const li = document.createElement('li');
        if (Array.isArray(node)) {
          li.className = 'tree-item var-item';
          const item = node[0];
          li.innerHTML = `
            <input class="var-checkbox select" type="checkbox">
            <span class="var-name">${item.variable_name}</span>
            <span class="var-datatype">${item.data_type}</span>
            <span class="var-nodeid" title="${item.node_id}">${item.node_id}</span>
            <div class="var-settings">
              <label><input type="checkbox" class="archive" title="Archive"> A</label>
              <label><input type="checkbox" class="grafana" title="Grafana"> G</label>
              <label><input type="checkbox" class="alarm" title="Alarm"> L</label>
            </div>
          `;
          li.dataset.item = JSON.stringify(item[0]);
        } else {
          li.className = 'tree-item';
          const count = countVars(node);
          const toggle = document.createElement('div');
          // Expand/collapse only for depth >= 1 (not for PLC level)
          if (depth >= 1) {
            toggle.className = 'db-item expanded';
            toggle.style.paddingLeft = (12 + (depth - 1) * 12) + 'px';
            toggle.textContent = `${key} (${count})`;
            const folder = document.createElement('ul');
            folder.className = 'db-items tree visible';
            folder.replaceChildren(...Object.keys(node).sort().map(k => renderNode(k, node[k], depth + 1)));
            toggle.addEventListener('click', () => {
              toggle.classList.toggle('expanded');
              toggle.classList.toggle('collapsed');
              folder.classList.toggle('visible');
            });
            li.append(toggle, folder);
          } else {
            // PLC level - no toggle, just render children
            toggle.className = 'db-item';
            toggle.style.paddingLeft = '0px';
            toggle.textContent = `${key}`;
            toggle.style.pointerEvents = 'none';
            toggle.style.fontWeight = '700';
            toggle.style.color = 'var(--fg-primary)';
            const folder = document.createElement('ul');
            folder.className = 'db-items tree visible';
            folder.replaceChildren(...Object.keys(node).sort().map(k => renderNode(k, node[k], depth + 1)));
            li.append(toggle, folder);
          }
        }
        return li;
      }
      rows.replaceChildren(...Object.keys(tree).sort().map(k => renderNode(k, tree[k], 0)));
    }

    function toggleAllDbs(expand = true) {
      [...rows.querySelectorAll('.db-item')].forEach(item => {
        const list = item.nextElementSibling;
        if (expand) {
          item.classList.add('expanded');
          item.classList.remove('collapsed');
          list.classList.add('visible');
        } else {
          item.classList.remove('expanded');
          item.classList.add('collapsed');
          list.classList.remove('visible');
        }
      });
    }

    load.addEventListener('click', () => loadVariables(false));
    refresh.addEventListener('click', () => loadVariables(true));
    expandAll.addEventListener('click', () => toggleAllDbs(true));
    collapseAll.addEventListener('click', () => toggleAllDbs(false));
    plc.addEventListener('change', () => loadVariables(false));
    [dbFilter, varFilter].forEach(input => input.addEventListener('keydown', e => { if (e.key === 'Enter') loadVariables(false); }));

    // Theme toggle
    function initTheme() {
      const saved = localStorage.getItem('theme');
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (dark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      updateThemeButton();
    }
    function updateThemeButton() {
      const theme = document.documentElement.getAttribute('data-theme');
      document.querySelector('#theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    document.querySelector('#theme-toggle').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton();
    });
    initTheme();

    // Load initial data
    loadPlcs().catch(error => setStatus('error', 'API Error', error.message));
  </script>
</body>
</html>
