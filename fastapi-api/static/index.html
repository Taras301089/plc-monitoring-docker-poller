<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLC Monitoring System</title>
  <style>
    :root {
      font-family: "Segoe UI", sans-serif;
      --bg-primary: white;
      --bg-secondary: #f0f3f6;
      --bg-tertiary: #e6ebed;
      --fg-primary: #17202a;
      --fg-secondary: #536471;
      --border-color: #c7d0d7;
      --header-bg: #17324d;
      --button-primary: #177245;
      --button-primary-hover: #125d39;
      --button-secondary: #2b6cb0;
      --button-secondary-hover: #1f4d7a;
      --button-tertiary: #536471;
      --status-border: #8493a0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #2a2a2a;
        --bg-secondary: #333333;
        --bg-tertiary: #404040;
        --fg-primary: #e8e8e8;
        --fg-secondary: #b0b0b0;
        --border-color: #444444;
        --header-bg: #0f1419;
        --button-primary: #2ea86e;
        --button-primary-hover: #23845a;
        --button-secondary: #3d8bcf;
        --button-secondary-hover: #2f6fa8;
        --button-tertiary: #6a7a87;
        --status-border: #5a6f7a;
      }
    }
    [data-theme="dark"] {
      --bg-primary: #2a2a2a;
      --bg-secondary: #333333;
      --bg-tertiary: #404040;
      --fg-primary: #e8e8e8;
      --fg-secondary: #b0b0b0;
      --border-color: #444444;
      --header-bg: #0f1419;
      --button-primary: #2ea86e;
      --button-primary-hover: #23845a;
      --button-secondary: #3d8bcf;
      --button-secondary-hover: #2f6fa8;
      --button-tertiary: #6a7a87;
      --status-border: #5a6f7a;
    }
    [data-theme="light"] {
      --bg-primary: white;
      --bg-secondary: #f0f3f6;
      --bg-tertiary: #e6ebed;
      --fg-primary: #17202a;
      --fg-secondary: #536471;
      --border-color: #c7d0d7;
      --header-bg: #17324d;
      --button-primary: #177245;
      --button-primary-hover: #125d39;
      --button-secondary: #2b6cb0;
      --button-secondary-hover: #1f4d7a;
      --button-tertiary: #536471;
      --status-border: #8493a0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg-secondary); color: var(--fg-primary); }
    body { display: flex; flex-direction: column; min-height: 100vh; }

    .theme-toggle { background: none; color: var(--fg-secondary); border: none; padding: 0; cursor: pointer; font-size: 16px; margin: 0 8px; display: flex; align-items: center; }
    .theme-toggle:hover { opacity: 0.8; }

    /* Навигационные табы */
    .tabs { background: var(--bg-primary); border-bottom: 2px solid var(--border-color); display: flex; gap: 0; padding: 0; margin: 0; align-items: stretch; }
    .tab { padding: 12px 16px; cursor: pointer; border: none; background: none; font-size: 13px; color: var(--fg-secondary); font-weight: 500; border-bottom: 3px solid transparent; margin: 0; white-space: nowrap; }
    .tab:hover { background: var(--bg-secondary); }
    .tab.active { color: var(--button-primary); border-bottom-color: var(--button-primary); }
    .tabs-divider { flex: 1; border-right: 1px solid var(--border-color); }
    .tabs-tools { display: flex; gap: 0; margin-left: auto; }
    .tabs-tools .theme-toggle { padding: 0 12px; display: flex; align-items: center; }

    /* Main content - WinCC compact */
    main { flex: 1; max-width: 100%; padding: 8px 12px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* WinCC-style toolbar - compact */
    .toolbar { display: grid; grid-template-columns: 1fr 1fr 1fr auto auto auto auto; gap: 4px; margin-bottom: 8px; }
    select, input, button { min-height: 28px; border: 1px solid var(--border-color); border-radius: 2px; padding: 0 8px; font: 11px 'Segoe UI', sans-serif; background: var(--bg-primary); color: var(--fg-primary); }
    button { background: var(--button-primary); color: white; border-color: var(--button-primary); cursor: pointer; font-weight: 500; font-size: 11px; }
    button:hover { background: var(--button-primary-hover); }
    #refresh { background: var(--button-secondary) !important; border-color: var(--button-secondary) !important; }
    #refresh:hover { background: var(--button-secondary-hover) !important; }

    /* Статус компактнее */
    .status { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 8px 12px; border: 1px solid var(--border-color); border-left: 4px solid var(--status-border); border-radius: 4px; background: var(--bg-secondary); color: var(--fg-secondary); font-size: 13px; margin: 8px 0; }
    .status-title { font-weight: 700; color: var(--fg-primary); white-space: nowrap; }
    .status-detail { overflow-wrap: anywhere; font-size: 12px; }
    .status.loading { border-left-color: #b7791f; background: #fffaf0; color: #3d3000; }
    .status.loading .status-title { color: #8a5a00; }
    .status.success { border-left-color: #177245; background: #effaf3; color: #0a3820; }
    .status.success .status-title { color: #0a3820; }
    .status.error { border-left-color: #b42318; background: #fff2f0; color: #5a1a12; }
    .status.error .status-title { color: #5a1a12; }
    [data-theme="dark"] .status.loading { background: #3a3000; color: #e8d78a; }
    [data-theme="dark"] .status.loading .status-title { color: #f4e4a6; }
    [data-theme="dark"] .status.success { background: #1a3a26; color: #7dd9a8; }
    [data-theme="dark"] .status.success .status-title { color: #7dd9a8; }
    [data-theme="dark"] .status.error { background: #3a1a14; color: #e8a89a; }
    [data-theme="dark"] .status.error .status-title { color: #e8a89a; }

    /* WinCC-like tree - compact and professional */
    .tree-wrap { max-height: calc(100vh - 240px); overflow: auto; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 0; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); font-family: 'Courier New', monospace; }
    .tree { list-style: none; padding: 0; margin: 0; background: var(--bg-primary); }
    .tree-item { margin: 0; }
    .db-item { display: flex; align-items: center; gap: 2px; padding: 0 6px; background: var(--bg-secondary); border-bottom: 1px solid #e0e0e0; cursor: pointer; user-select: none; font-weight: 600; font-size: 11px; color: var(--fg-primary); min-height: 16px; line-height: 16px; }
    .db-item:hover { background: var(--bg-tertiary); }
    .db-item.collapsed::before { content: '►'; display: inline-block; width: 10px; color: var(--fg-secondary); font-size: 10px; text-align: center; }
    .db-item.expanded::before { content: '▼'; display: inline-block; width: 10px; color: var(--fg-secondary); font-size: 10px; text-align: center; }
    .db-item.expanded { background: var(--bg-tertiary); }
    .db-items { display: none; }
    .db-items.visible { display: block; }
    .var-item { display: flex; align-items: center; gap: 3px; padding: 0 6px 0 20px; background: var(--bg-primary); border-bottom: 1px solid #f0f0f0; font-size: 10px; min-height: 14px; line-height: 14px; }
    .var-item:hover { background: var(--bg-secondary); }
    .var-checkbox { width: 14px; height: 14px; accent-color: var(--button-primary); cursor: pointer; margin: 0; flex-shrink: 0; }
    .var-name { flex: 0 0 140px; color: var(--fg-primary); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
    .var-datatype { flex: 0 0 70px; color: var(--fg-secondary); font-family: monospace; font-size: 9px; overflow: hidden; text-overflow: ellipsis; }
    .var-nodeid { flex: 1; color: #666666; font-family: monospace; font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .var-settings { display: flex; gap: 4px; flex-shrink: 0; }
    .var-settings input { width: 12px; height: 12px; margin: 0; accent-color: var(--button-primary); cursor: pointer; }
    .var-settings label { font-size: 9px; display: flex; align-items: center; gap: 2px; white-space: nowrap; }

    /* Settings вкладка */
    .settings-form { max-width: 500px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: var(--fg-primary); }
    input[type="text"], input[type="number"] { width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--fg-primary); font-size: 13px; }
    .connection-status { display: flex; align-items: center; gap: 10px; margin-top: 20px; padding: 12px; background: var(--bg-secondary); border-radius: 4px; border: 1px solid var(--border-color); }
    .status-indicator { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .status-indicator.connected { background: #d4edda; color: #155724; }
    .status-indicator.disconnected { background: #f8d7da; color: #721c24; }
    .status-text { flex: 1; }
    .status-text strong { display: block; font-size: 13px; margin-bottom: 2px; }
    .status-text small { font-size: 12px; color: var(--fg-secondary); }

    /* Expand/Collapse buttons */
    .action-buttons { display: flex; gap: 8px; margin-bottom: 12px; }
    .action-buttons button { padding: 6px 12px; font-size: 13px; }

    .empty { padding: 32px; text-align: center; color: var(--fg-secondary); font-size: 13px; }

    /* Connection Wizard */
    .connection-wizard { max-width: 600px; }
    .steps-indicator { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
    .step { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .step-number { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-secondary); border: 2px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; }
    .step.active .step-number { background: var(--button-primary); color: white; border-color: var(--button-primary); }
    .step-label { font-size: 11px; text-align: center; color: var(--fg-secondary); }
    .step-connector { flex: 1; height: 2px; background: var(--border-color); }
    .step.active ~ .step-connector { background: var(--button-primary); }

    .wizard-step { display: none; }
    .wizard-step.active { display: block; }
    .step-content { padding: 16px; background: var(--bg-secondary); border-radius: 4px; }
    .connection-result { background: #e8f5e9; border: 1px solid #a5d6a7; color: #2e7d32; }
    .connection-result.error { background: #ffebee; border: 1px solid #ef9a9a; color: #c62828; }

    /* PLC Manager */
    .plc-manager { padding: 12px; background: var(--bg-secondary); border-radius: 4px; margin-bottom: 12px; }
    .plc-item { padding: 8px 12px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .plc-item-info { display: flex; align-items: center; gap: 8px; }
    .plc-status { font-size: 14px; }
    .plc-item-actions { display: flex; gap: 4px; }
    .plc-item-actions button { padding: 2px 6px; font-size: 11px; }

    /* Two-panel WinCC layout */
    .browser-header { padding: 8px 0; border-bottom: 1px solid var(--border-color); }
    .two-panel-layout { display: flex; gap: 8px; height: calc(100vh - 300px); margin-top: 8px; }

    .db-list-panel {
      flex: 0 0 220px;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
    }
    .db-list-panel .panel-header {
      padding: 8px 10px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
      font-size: 12px;
      color: var(--fg-primary);
      white-space: nowrap;
    }
    .db-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .db-list-item {
      padding: 8px 10px;
      border-bottom: 1px solid #e0e0e0;
      cursor: pointer;
      font-size: 11px;
      color: var(--fg-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .db-list-item:hover {
      background: var(--bg-tertiary);
    }
    .db-list-item.selected {
      background: var(--button-primary);
      color: white;
      font-weight: 600;
    }

    .variables-panel {
      flex: 1;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
    }
    .variables-panel .panel-header {
      padding: 8px 10px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
      font-size: 12px;
      color: var(--fg-primary);
      white-space: nowrap;
    }
    .variables-panel .tree-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }
    .variables-panel #rows {
      list-style: none;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <nav class="tabs">
    <button class="tab active" data-tab="browser" title="Просмотр всех переменных ПЛК в реальном времени с возможностью поиска и фильтрации">📊 Переменные ПЛК</button>
    <button class="tab" data-tab="saved" title="Переменные сохранённые в базе данных для дальнейшего анализа и мониторинга">💾 Переменные БД</button>
    <button class="tab" data-tab="charts" title="Графики и визуализация исторических данных переменных">📈 Графики</button>
    <button class="tab" data-tab="notifications" title="Параметры подключения к ПЛК и настройки оповещений">🔔 Оповещения</button>
    <div class="tabs-divider"></div>
    <div class="tabs-tools">
      <button id="theme-toggle" class="theme-toggle" title="Переключить между тёмной и светлой темой (сохраняется автоматически)">🌙</button>
      <a href="reference.html" style="color: var(--fg-secondary); text-decoration: none; font-size: 13px; padding: 12px 16px; border-bottom: 3px solid transparent; display: flex; align-items: center; white-space: nowrap; cursor: help;" title="Справочная информация о системе, архитектуре и развёртывании">📖 Справка</a>
    </div>
  </nav>

  <main>
    <!-- TAB 1: PLC Variables Browser -->
    <div id="browser" class="tab-content active">
      <!-- PLC Selection & Actions -->
      <div style="display: flex; gap: 8px; margin-bottom: 12px; align-items: center;">
        <select id="plc" style="flex: 1; min-height: 36px;" title="Выберите ПЛК для просмотра переменных. 🟢 = на связи, ❌ = отключено."></select>
        <button id="edit-plc" style="padding: 6px 12px; font-size: 14px; background: var(--button-secondary); border-color: var(--button-secondary);" title="Редактировать выбранный ПЛК (IP, порт)">✏️</button>
        <button id="delete-plc" style="padding: 6px 12px; font-size: 14px; background: #d32f2f; border-color: #d32f2f; color: white;" title="Удалить выбранный ПЛК из системы">🗑️</button>
        <button id="toggle-add-plc" style="padding: 6px 12px; font-size: 14px; min-width: 40px;" title="Добавить новый ПЛК">➕</button>
      </div>

      <!-- Add New PLC Form (hidden by default) -->
      <div id="add-plc-form" style="display: none; padding: 12px; background: var(--bg-secondary); border-radius: 4px; margin-bottom: 12px;">
        <div style="display: grid; grid-template-columns: 1fr 1fr 100px; gap: 8px;">
          <input id="new-plc-name" placeholder="Имя ПЛК" title="Удобное имя для идентификации ПЛК">
          <input id="new-plc-ip" placeholder="IP адрес" title="IP адрес устройства ПЛК">
          <input id="new-plc-port" type="number" placeholder="Порт" value="4840" title="OPC UA порт (обычно 4840)">
        </div>
        <div style="display: flex; gap: 8px; margin-top: 8px;">
          <button id="add-plc" style="padding: 6px 12px; font-size: 12px; flex: 1;" title="Добавить новый ПЛК в систему">✓ Добавить</button>
          <button id="cancel-add-plc" style="padding: 6px 12px; font-size: 12px; background: var(--button-tertiary); border-color: var(--button-tertiary);" title="Отменить добавление">✕ Отмена</button>
        </div>
      </div>

      <!-- Edit PLC Form (hidden by default) -->
      <div id="edit-plc-form" style="display: none; padding: 12px; background: var(--bg-secondary); border-radius: 4px; margin-bottom: 12px;">
        <div style="display: grid; grid-template-columns: 1fr 1fr 100px; gap: 8px;">
          <input id="edit-plc-name" placeholder="Имя ПЛК" title="Имя ПЛК (для идентификации)">
          <input id="edit-plc-ip" placeholder="IP адрес" title="IP адрес устройства ПЛК">
          <input id="edit-plc-port" type="number" placeholder="Порт" title="OPC UA порт (обычно 4840)">
        </div>
        <div style="display: flex; gap: 8px; margin-top: 8px;">
          <button id="save-plc" style="padding: 6px 12px; font-size: 12px; flex: 1; background: var(--button-secondary); border-color: var(--button-secondary);" title="Сохранить изменения">✓ Сохранить</button>
          <button id="cancel-edit-plc" style="padding: 6px 12px; font-size: 12px; background: var(--button-tertiary); border-color: var(--button-tertiary);" title="Отменить редактирование">✕ Отмена</button>
        </div>
      </div>

      <!-- Variables Browser - Two Panel Layout -->
      <div class="browser-header">
        <div style="display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap;">
          <select id="plc" style="min-width: 200px; min-height: 32px;" title="Выберите ПЛК для просмотра переменных. 🟢 = на связи, ❌ = отключено."></select>
          <input id="var-filter" placeholder="Поиск переменной" style="flex: 1; min-width: 150px; min-height: 32px;" title="Поиск по названию переменной">
          <button id="load" title="Загрузить переменные из БД">Загрузить из БД</button>
          <button id="refresh" title="Обновить с ПЛК">Обновить с ПЛК</button>
          <button id="save" title="Сохранить выбранные">Сохранить выбранные</button>
        </div>
        <div class="status" id="status" role="status" style="margin-bottom: 8px;">
          <span class="status-title">Готово</span>
          <span class="status-detail">Выберите ПЛК и нажмите «Загрузить из БД» или «Обновить с ПЛК»</span>
        </div>
      </div>

      <!-- Two Panel Layout -->
      <div class="two-panel-layout">
        <!-- Left Panel: Data Blocks List -->
        <div class="db-list-panel">
          <div class="panel-header">📊 Data Blocks</div>
          <ul class="db-list" id="db-list"></ul>
        </div>

        <!-- Right Panel: Variables -->
        <div class="variables-panel">
          <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
            <span id="selected-db-name">Выберите Data Block</span>
            <div style="display: flex; gap: 4px;">
              <button id="expand-all" style="padding: 4px 8px; font-size: 11px; background: var(--button-tertiary); border-color: var(--button-tertiary); color: white;" title="Развернуть все">▼</button>
              <button id="collapse-all" style="padding: 4px 8px; font-size: 11px; background: var(--button-tertiary); border-color: var(--button-tertiary); color: white;" title="Свернуть все">▶</button>
            </div>
          </div>
          <input id="db-filter" placeholder="Поиск в блоке" style="width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid var(--border-color); border-radius: 3px; background: var(--bg-primary); color: var(--fg-primary); font-size: 12px; box-sizing: border-box;" title="Поиск в выбранном Data Block">
          <ul class="tree" id="rows"><li class="empty">Выберите Data Block слева</li></ul>
        </div>
      </div>
    </div>

    <!-- TAB 2: DB Variables -->
    <div id="saved" class="tab-content">
      <p style="color: var(--fg-secondary); font-size: 13px;">Переменные из БД будут показаны здесь</p>
    </div>

    <!-- TAB 3: Charts -->
    <div id="charts" class="tab-content">
      <p style="color: var(--fg-secondary); font-size: 13px;">Графики будут показаны здесь</p>
    </div>

    <!-- TAB 4: Alerts & Notifications -->
    <div id="notifications" class="tab-content">
      <p style="color: var(--fg-secondary); font-size: 13px;">Алерты и оповещения будут настроены здесь в будущих версиях</p>
    </div>
  </main>

  <script>
    const plc = document.querySelector('#plc');
    const dbFilter = document.querySelector('#db-filter');
    const varFilter = document.querySelector('#var-filter');
    const load = document.querySelector('#load');
    const refresh = document.querySelector('#refresh');
    const save = document.querySelector('#save');
    const expandAll = document.querySelector('#expand-all');
    const collapseAll = document.querySelector('#collapse-all');
    const status = document.querySelector('#status');
    const rows = document.querySelector('#rows');

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });

    async function loadPlcs() {
      try {
        const response = await fetch('/api/plcs');
        if (!response.ok) throw new Error('Ошибка загрузки списка ПЛК');
        const items = await response.json();
        plc.replaceChildren(...items.map(item => {
          const status = item.is_active ? '🟢' : '❌';
          const ip = item.ip_address || 'N/A';
          return new Option(`${status} ${item.name} - ${ip}`, item.id);
        }));
        if (items.length) {
          if (!plc.value) plc.value = items[0].id;
          setStatus('success', 'Готово', 'Выберите ПЛК');
        }
      } catch (error) {
        setStatus('error', 'Ошибка API', error.message);
      }
    }

    // Обработчик изменения select - автоматически загружать из БД
    plc.addEventListener('change', () => {
      if (plc.value) loadVariables(false);
    });

    document.getElementById('add-plc').addEventListener('click', async () => {
      const name = document.getElementById('new-plc-name').value.trim();
      const ip = document.getElementById('new-plc-ip').value.trim();
      const port = document.getElementById('new-plc-port').value.trim();

      if (!name || !ip || !port) {
        alert('Заполните все поля');
        return;
      }

      try {
        const response = await fetch('/api/plcs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            opc_endpoint: `opc.tcp://${ip}:${port}`,
            is_active: true
          })
        });
        if (!response.ok) throw new Error('Ошибка добавления ПЛК');
        document.getElementById('new-plc-name').value = '';
        document.getElementById('new-plc-ip').value = '';
        document.getElementById('new-plc-port').value = '4840';
        document.getElementById('add-plc-form').style.display = 'none';
        loadPlcs();
        setStatus('success', 'Готово', 'Новый ПЛК добавлен');
      } catch (error) {
        setStatus('error', 'Ошибка', error.message);
      }
    });

    // Показать/скрыть форму добавления
    document.getElementById('toggle-add-plc').addEventListener('click', () => {
      const form = document.getElementById('add-plc-form');
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    });

    // Отмена добавления
    document.getElementById('cancel-add-plc').addEventListener('click', () => {
      document.getElementById('add-plc-form').style.display = 'none';
      document.getElementById('new-plc-name').value = '';
      document.getElementById('new-plc-ip').value = '';
      document.getElementById('new-plc-port').value = '4840';
    });

    // Редактировать ПЛК
    document.getElementById('edit-plc').addEventListener('click', () => {
      if (!plc.value) {
        setStatus('error', 'Ошибка', 'Выберите ПЛК для редактирования');
        return;
      }
      const option = plc.options[plc.selectedIndex];
      const text = option.text;
      const [name, ...rest] = text.split(' - ');
      const ip = rest.join(' - ').split(':')[0];
      const port = rest.join(' - ').split(':')[1] || '4840';

      document.getElementById('edit-plc-name').value = name.replace(/[🟢❌]\s/, '');
      document.getElementById('edit-plc-ip').value = ip;
      document.getElementById('edit-plc-port').value = port;
      document.getElementById('edit-plc-form').style.display = 'block';
    });

    // Сохранить изменения ПЛК
    document.getElementById('save-plc').addEventListener('click', async () => {
      if (!plc.value) return;
      let name = document.getElementById('edit-plc-name').value.trim();
      const ip = document.getElementById('edit-plc-ip').value.trim();
      const port = document.getElementById('edit-plc-port').value.trim();

      name = name.replace(/[🔧🌐📋]/g, '').trim();

      if (!name || !ip || !port) {
        alert('Заполните все поля');
        return;
      }

      try {
        const response = await fetch(`/api/plcs/${plc.value}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            opc_endpoint: `opc.tcp://${ip}:${port}`
          })
        });
        if (!response.ok) throw new Error('Ошибка сохранения ПЛК');
        document.getElementById('edit-plc-form').style.display = 'none';
        loadPlcs();
        setStatus('success', 'Готово', 'ПЛК обновлён');
      } catch (error) {
        setStatus('error', 'Ошибка', error.message);
      }
    });

    // Отмена редактирования
    document.getElementById('cancel-edit-plc').addEventListener('click', () => {
      document.getElementById('edit-plc-form').style.display = 'none';
    });

    // Удалить ПЛК
    document.getElementById('delete-plc').addEventListener('click', async () => {
      if (!plc.value) {
        setStatus('error', 'Ошибка', 'Выберите ПЛК для удаления');
        return;
      }
      if (!confirm('Удалить этот ПЛК из системы?')) return;

      try {
        const response = await fetch(`/api/plcs/${plc.value}`, { method: 'DELETE' });
        if (!response.ok) throw new Error('Ошибка удаления ПЛК');
        loadPlcs();
        setStatus('success', 'Готово', 'ПЛК удалён');
      } catch (error) {
        setStatus('error', 'Ошибка', error.message);
      }
    });

    function setStatus(kind, title, detail) {
      status.className = `status ${kind}`;
      status.innerHTML = `<span class="status-title">${title}</span><span class="status-detail">${detail}</span>`;
    }

    function buildHierarchy(items) {
      const tree = {};
      items.forEach(item => {
        const fullPath = item.browse_path ? item.browse_path.split('.') : [item.variable_name];
        // Filter out "Inputs" and "Static" levels
        const path = fullPath.filter(p => p !== 'Inputs' && p !== 'Static');

        let current = tree;
        for (let i = 0; i < path.length - 1; i++) {
          const key = path[i];
          if (!current[key]) current[key] = {};
          else if (Array.isArray(current[key])) return;
          current = current[key];
        }
        const varKey = path[path.length - 1];
        if (!current[varKey]) current[varKey] = [];
        else if (!Array.isArray(current[varKey])) return;
        current[varKey].push(item);
      });
      return tree;
    }

    async function loadVariables(forceRefresh = false) {
      if (!plc.value) return;
      setStatus('loading', 'Загрузка...', forceRefresh ? 'Сканирование OPC UA...' : 'Чтение из БД...');
      load.disabled = true;
      refresh.disabled = true;
      try {
        const params = new URLSearchParams();
        if (dbFilter.value.trim()) params.set('db', dbFilter.value.trim());
        if (varFilter.value.trim()) params.set('name', varFilter.value.trim());
        if (forceRefresh) params.set('refresh', 'true');
        const response = await fetch(`/api/plcs/${plc.value}/opcua/variables?${params}`);
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || 'Ошибка просмотра');
        renderHierarchy(payload);
        setStatus('success', 'Успешно', `Загружено ${payload.length} переменных`);
      } catch (error) {
        rows.innerHTML = '<li class="empty">Данных нет</li>';
        setStatus('error', 'Ошибка', error.message);
      } finally { load.disabled = false; refresh.disabled = false; }
    }

    let allVariables = []; // Store all loaded variables for filtering
    let selectedDB = null; // Currently selected DB

    function renderHierarchy(items) {
      if (!items.length) {
        rows.innerHTML = '<li class="empty">Переменные не найдены</li>';
        dbList.innerHTML = '<li class="empty" style="padding: 10px; text-align: center; color: var(--fg-secondary);">Нет Data Blocks</li>';
        return;
      }

      allVariables = items;
      const dbMap = {};

      // Group variables by first level of browse_path (Data Block name)
      items.forEach(item => {
        const browsePath = item.browse_path || '';
        const pathParts = browsePath.split('.');
        const dataBlockName = pathParts[0] || item.variable_name || 'Unknown';

        if (!dbMap[dataBlockName]) dbMap[dataBlockName] = [];
        dbMap[dataBlockName].push(item);
      });

      // Render DB list in left panel
      const dbList = document.querySelector('#db-list');
      dbList.innerHTML = '';
      Object.keys(dbMap).sort().forEach(dbName => {
        const li = document.createElement('li');
        li.className = 'db-list-item';
        li.textContent = `${dbName} (${dbMap[dbName].length})`;
        li.dataset.dbName = dbName;
        li.addEventListener('click', () => {
          document.querySelectorAll('.db-list-item').forEach(x => x.classList.remove('selected'));
          li.classList.add('selected');
          selectedDB = dbName;
          renderVariablesForDB(dbName);
          document.querySelector('#selected-db-name').textContent = dbName;
        });
        dbList.appendChild(li);
      });
    }

    function renderVariablesForDB(dbName) {
      const filtered = allVariables.filter(v => {
        // Filter by first level of browse_path (Data Block name)
        const browsePath = v.browse_path || '';
        const pathParts = browsePath.split('.');
        const dataBlockName = pathParts[0] || v.variable_name || 'Unknown';

        if (dataBlockName !== dbName) return false;
        if (!varFilter.value.trim()) return true;
        const search = varFilter.value.trim().toLowerCase();
        return v.variable_name.toLowerCase().includes(search) ||
               v.node_id.toLowerCase().includes(search);
      });

      if (!filtered.length) {
        rows.innerHTML = '<li class="empty">Переменные не найдены</li>';
        return;
      }

      // Build tree for this DB
      const tree = {};
      filtered.forEach(item => {
        const fullPath = item.browse_path ? item.browse_path.split('.') : [item.variable_name];
        const path = fullPath.filter(p => p !== 'Inputs' && p !== 'Static');

        let current = tree;
        for (let i = 0; i < path.length - 1; i++) {
          const key = path[i];
          if (!current[key]) current[key] = {};
          else if (Array.isArray(current[key])) return;
          current = current[key];
        }
        const varKey = path[path.length - 1];
        if (!current[varKey]) current[varKey] = [];
        else if (!Array.isArray(current[varKey])) return;
        current[varKey].push(item);
      });

      // Render variables
      function countVars(node) {
        if (Array.isArray(node)) return node.length;
        return Object.values(node).reduce((sum, n) => sum + countVars(n), 0);
      }

      function renderNode(key, node, depth) {
        const li = document.createElement('li');
        if (Array.isArray(node)) {
          li.className = 'tree-item var-item';
          const item = node[0];
          li.innerHTML = `
            <input class="var-checkbox select" type="checkbox">
            <span class="var-name">${item.variable_name}</span>
            <span class="var-datatype">${item.data_type}</span>
            <span class="var-nodeid" title="${item.node_id}">${item.node_id}</span>
            <div class="var-settings">
              <label><input type="checkbox" class="archive" title="Archive"> A</label>
              <label><input type="checkbox" class="grafana" title="Grafana"> G</label>
              <label><input type="checkbox" class="alarm" title="Alarm"> L</label>
            </div>
          `;
          li.dataset.item = JSON.stringify(item[0]);
        } else {
          li.className = 'tree-item';
          const count = countVars(node);
          const toggle = document.createElement('div');
          toggle.className = 'db-item expanded';
          toggle.style.paddingLeft = (depth * 12) + 'px';
          toggle.textContent = `${key} (${count})`;
          const folder = document.createElement('ul');
          folder.className = 'db-items tree visible';
          folder.replaceChildren(...Object.keys(node).sort().map(k => renderNode(k, node[k], depth + 1)));
          toggle.addEventListener('click', () => {
            toggle.classList.toggle('expanded');
            toggle.classList.toggle('collapsed');
            folder.classList.toggle('visible');
          });
          li.append(toggle, folder);
        }
        return li;
      }
      rows.replaceChildren(...Object.keys(tree).sort().map(k => renderNode(k, tree[k], 0)));
    }

    function toggleAllDbs(expand = true) {
      [...rows.querySelectorAll('.db-item')].forEach(item => {
        const list = item.nextElementSibling;
        if (expand) {
          item.classList.add('expanded');
          item.classList.remove('collapsed');
          list.classList.add('visible');
        } else {
          item.classList.remove('expanded');
          item.classList.add('collapsed');
          list.classList.remove('visible');
        }
      });
    }

    const dbList = document.querySelector('#db-list');

    load.addEventListener('click', () => loadVariables(false));
    refresh.addEventListener('click', () => loadVariables(true));
    expandAll.addEventListener('click', () => toggleAllDbs(true));
    collapseAll.addEventListener('click', () => toggleAllDbs(false));
    plc.addEventListener('change', () => loadVariables(false));

    // Filter for variables in selected DB
    varFilter.addEventListener('input', () => {
      if (selectedDB) renderVariablesForDB(selectedDB);
    });
    varFilter.addEventListener('keydown', e => {
      if (e.key === 'Enter' && selectedDB) renderVariablesForDB(selectedDB);
    });

    // Theme toggle
    function initTheme() {
      const saved = localStorage.getItem('theme');
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (dark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      updateThemeButton();
    }
    function updateThemeButton() {
      const theme = document.documentElement.getAttribute('data-theme');
      document.querySelector('#theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    document.querySelector('#theme-toggle').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton();
    });
    initTheme();

    // Load initial data
    loadPlcs().catch(error => setStatus('error', 'API Error', error.message));
  </script>
</body>
</html>
